<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrow Rush</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: Arial, sans-serif;
      color: white;
    }

    .wrapper {
      width: 700px;
      max-width: 90vw;
    }

    .title {
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 2px;
      color: #f8fafc;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.75);
      border: 2px solid rgba(148, 163, 184, 0.4);
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 10px;
      font-size: 1.1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    #gameArea {
      position: relative;
      width: 100%;
      height: 620px;
      border-radius: 14px;
      overflow: hidden;
      background:
        linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.02)),
        #111827;
      border: 3px solid rgba(94, 234, 212, 0.5);
      box-shadow: inset 0 0 30px rgba(45, 212, 191, 0.12);
    }

    .lane {
      position: absolute;
      top: 0;
      width: 25%;
      height: 100%;
      border-right: 2px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.2);
    }

    .lane:nth-child(1) { left: 0; }
    .lane:nth-child(2) { left: 25%; }
    .lane:nth-child(3) { left: 50%; }
    .lane:nth-child(4) { left: 75%; }

    .lane-label {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      background: rgba(148, 163, 184, 0.15);
      border: 2px solid rgba(148, 163, 184, 0.4);
      color: #e2e8f0;
    }

    #hitLine {
      position: absolute;
      left: 0;
      right: 0;
      top: 500px;
      height: 8px;
      background: linear-gradient(90deg, #22d3ee, #a78bfa, #22d3ee);
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.7);
      z-index: 2;
    }

    #arrows {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    .arrow {
      position: absolute;
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: white;
      box-shadow: 0 10px 25px rgba(249, 115, 22, 0.45);
      border: 3px solid rgba(255,255,255,0.25);
      transform: translateX(-50%);
      user-select: none;
    }

    .controls {
      text-align: center;
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 0.98rem;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: rgba(2, 6, 23, 0.7);
      font-size: 2rem;
      font-weight: bold;
      color: #f8fafc;
      text-align: center;
      z-index: 10;
    }

    #overlay.hidden {
      display: none;
    }

    .small {
      font-size: 1rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="title">ARROW RUSH</div>

    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Lives: <span id="lives">3</span></div>
      <div>Combo: <span id="combo">0</span></div>
    </div>

    <div id="gameArea">
      <div class="lane"><div class="lane-label">←</div></div>
      <div class="lane"><div class="lane-label">↑</div></div>
      <div class="lane"><div class="lane-label">↓</div></div>
      <div class="lane"><div class="lane-label">→</div></div>

      <div id="hitLine"></div>
      <div id="arrows"></div>

      <div id="overlay" class="hidden">
        <div>Game Over</div>
        <div class="small">Press R to restart</div>
      </div>
    </div>

    <div class="controls">
      Press ← ↑ ↓ → to hit the falling arrows. Press R to restart.
    </div>
  </div>

  <script>
    const laneKeys = ["ArrowLeft", "ArrowUp", "ArrowDown", "ArrowRight"];
    const laneSymbols = {
      ArrowLeft: "←",
      ArrowUp: "↑",
      ArrowDown: "↓",
      ArrowRight: "→"
    };
    const lanePositions = [12.5, 37.5, 62.5, 87.5]; // percentages for x positions

    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const comboEl = document.getElementById("combo");
    const arrowsEl = document.getElementById("arrows");
    const overlayEl = document.getElementById("overlay");

    const state = {
      score: 0,
      lives: 3,
      combo: 0,
      arrows: [],
      lastTime: 0,
      lastSpawn: 0,
      gameOver: false
    };

    function updateHUD() {
      scoreEl.textContent = state.score;
      livesEl.textContent = state.lives;
      comboEl.textContent = state.combo;
    }

    function spawnArrow() {
      if (state.gameOver) return;

      const key = laneKeys[Math.floor(Math.random() * laneKeys.length)];
      const arrow = {
        id: Math.random().toString(36).slice(2),
        key,
        lane: laneKeys.indexOf(key),
        y: -70,
        speed: 180 + Math.random() * 55,
        hit: false,
        el: null
      };

      const el = document.createElement("div");
      el.className = "arrow";
      el.textContent = laneSymbols[key];
      el.style.left = `${lanePositions[arrow.lane]}%`;
      el.style.top = `${arrow.y}px`;
      arrowsEl.appendChild(el);

      arrow.el = el;
      state.arrows.push(arrow);
    }

    function removeArrow(arrow) {
      if (arrow.el && arrow.el.parentNode) {
        arrow.el.parentNode.removeChild(arrow.el);
      }
      state.arrows = state.arrows.filter(item => item.id !== arrow.id);
    }

    function hitArrow(key) {
      if (state.gameOver) return;

      const matchingArrow = [...state.arrows]
        .reverse()
        .find(arrow => arrow.key === key && !arrow.hit && Math.abs(arrow.y - 500) < 55);

      if (matchingArrow) {
        matchingArrow.hit = true;
        removeArrow(matchingArrow);
        state.combo += 1;
        state.score += 10 + state.combo * 2;
        updateHUD();
      } else {
        state.combo = 0;
        updateHUD();
      }
    }

    function loseLife(arrow) {
      removeArrow(arrow);
      state.combo = 0;
      state.lives -= 1;
      updateHUD();

      if (state.lives <= 0) {
        state.gameOver = true;
        overlayEl.classList.remove("hidden");
      }
    }

    function gameLoop(timestamp) {
      if (state.gameOver) return;

      const dt = (timestamp - state.lastTime) / 1000 || 0.016;
      state.lastTime = timestamp;

      if (timestamp - state.lastSpawn > 900) {
        spawnArrow();
        state.lastSpawn = timestamp;
      }

      for (let i = state.arrows.length - 1; i >= 0; i--) {
        const arrow = state.arrows[i];
        arrow.y += arrow.speed * dt;
        arrow.el.style.top = `${arrow.y}px`;

        if (arrow.y > 620) {
          loseLife(arrow);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      state.score = 0;
      state.lives = 3;
      state.combo = 0;
      state.lastTime = 0;
      state.lastSpawn = 0;
      state.gameOver = false;

      state.arrows.forEach(arrow => {
        if (arrow.el && arrow.el.parentNode) {
          arrow.el.parentNode.removeChild(arrow.el);
        }
      });

      state.arrows = [];
      overlayEl.classList.add("hidden");
      updateHUD();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (event) => {
      const key = event.key;

      if (key === "r" || key === "R") {
        if (state.gameOver) {
          resetGame();
        }
        return;
      }

      if (!laneKeys.includes(key)) return;

      event.preventDefault();
      hitArrow(key);
    });

    updateHUD();
    resetGame();
  </script>
</body>
</html>
